<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 560px;
    }
    h1 {
      font-size: 22px;
      color: #1a202c;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: #718096;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #4a5568;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
      color: #2d3748;
      background: #f7fafc;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #4299e1;
      background: white;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #2b6cb0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Student Performance Predictor</h1>
    <p class="subtitle">Enter student information to predict Pass or Fail</p>
    <form action="/predict" method="POST">

      <div class="form-group">
        <label>Study Time (1=low, 4=high)</label>
        <input type="number" name="studytime" min="1" max="4" required placeholder="1 to 4">
      </div>

      <div class="form-group">
        <label>Number of Past Failures</label>
        <input type="number" name="failures" min="0" max="4" required placeholder="0 to 4">
      </div>

      <div class="form-group">
        <label>Number of Absences</label>
        <input type="number" name="absences" min="0" max="93" required placeholder="0 to 93">
      </div>

      <div class="form-group">
        <label>Wants Higher Education?</label>
        <select name="higher" required>
          <option value="">-- Select --</option>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Has Internet at Home?</label>
        <select name="internet" required>
          <option value="">-- Select --</option>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>First Period Grade (G1) — 0 to 20</label>
        <input type="number" name="G1" min="0" max="20" required placeholder="0 to 20">
      </div>

      <div class="form-group">
        <label>Second Period Grade (G2) — 0 to 20</label>
        <input type="number" name="G2" min="0" max="20" required placeholder="0 to 20">
      </div>

      <div class="form-group">
        <label>Health Status (1=very bad, 5=very good)</label>
        <input type="number" name="health" min="1" max="5" required placeholder="1 to 5">
      </div>

      <button type="submit">Predict</button>
    </form>
  </div>
</body>
</html>
